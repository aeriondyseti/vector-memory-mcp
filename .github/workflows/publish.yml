name: Publish to npm

# Releases are cut by pushing a version tag:
#   npm version <patch|minor|major|X.Y.Z> && git push --follow-tags
# vX.Y.Z        → @latest (tag must be on main)
# vX.Y.Z-<pre>  → @next   (e.g. v3.0.0-beta.1; any branch)
on:
  push:
    tags: ['v*']

permissions:
  id-token: write   # Required for OIDC trusted publishing
  contents: write   # Required to create releases

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Full history needed for branch-tag validation

      - name: Determine npm tag
        id: npm-tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$VERSION" == *-* ]]; then TAG="next"; else TAG="latest"; fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Publishing $VERSION with npm tag: $TAG"

      - name: Validate tag matches package.json
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [[ "$PKG_VERSION" != "${{ steps.npm-tag.outputs.version }}" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION. Cut releases with 'npm version'."
            exit 1
          fi

      - name: Validate stable tag is on main
        if: steps.npm-tag.outputs.tag == 'latest'
        run: |
          if ! git branch -r --contains "$GITHUB_SHA" | grep -q 'origin/main$'; then
            echo "::error::Tag $GITHUB_REF_NAME does not point to a commit on main. Stable releases must be tagged from main."
            exit 1
          fi

      - name: Extract release notes from CHANGELOG
        if: steps.npm-tag.outputs.tag == 'latest'
        env:
          VERSION: ${{ steps.npm-tag.outputs.version }}
        run: |
          # Lines after "## [X.Y.Z]" up to the next "## [" heading
          awk -v v="$VERSION" '/^## \[/ { if (f) exit; if (index($0, "## [" v "]") == 1) { f = 1; next } } f' \
            CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section. Add one before tagging a stable release."
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node.js (for npm publish)
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Same command Claude Code runs when it copies the plugin: fails if
      # plugin/bun.lock is out of sync with plugin/package.json.
      - name: Install plugin dependencies
        run: bun install --cwd plugin --frozen-lockfile --ignore-scripts

      - name: Run tests
        run: bun run test

      - name: Typecheck
        run: bun run typecheck

      - name: Publish to npm
        run: npm publish --access public --provenance --tag ${{ steps.npm-tag.outputs.tag }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.npm-tag.outputs.version }}
        run: |
          if [[ "${{ steps.npm-tag.outputs.tag }}" == "next" ]]; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
              --prerelease --generate-notes --verify-tag
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
              --notes-file notes.md --verify-tag
          fi
