name: CI

on:
  push:
    branches: [main, dev, 'rc/*']
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify vendored hook-kit matches lockfile
        run: |
          bun run vendor:hooks
          if [ -n "$(git status --porcelain -- plugin/hooks/scripts/vendor)" ]; then
            echo "::error::Vendored hook-kit is stale. Run 'bun run vendor:hooks' and commit plugin/hooks/scripts/vendor/."
            git status --porcelain -- plugin/hooks/scripts/vendor
            exit 1
          fi

      - name: Typecheck
        run: bun run typecheck

      - name: Run tests
        run: bun run test
