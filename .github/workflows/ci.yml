name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Same command Claude Code runs when it copies the plugin: fails if
      # plugin/bun.lock is out of sync with plugin/package.json.
      - name: Install plugin dependencies
        run: bun install --cwd plugin --frozen-lockfile --ignore-scripts

      - name: Typecheck
        run: bun run typecheck

      - name: Run tests
        run: bun run test
