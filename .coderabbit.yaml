language: "en-US"
early_access: false
tone_instructions: "Be direct and technical. Skip praise for routine code. Focus on bugs, missed edge cases, and architectural issues."

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  changed_files_summary: true
  poem: false
  sequence_diagrams: false
  collapse_walkthrough: true

  path_filters:
    - "!docs/**"
    - "!*.md"
    - "!.github/**"

  path_instructions:
    - path: "**/*.ts"
      instructions: |
        Runtime: Bun (not Node.js) for server/, scripts/ and tests/. Use bun:sqlite, Bun.file(), Bun.serve(), etc.
        Module resolution: Bundler — relative imports have no .js extension.
        TypeScript strict mode. No JSDoc tags (@param, @returns): types serve as documentation;
        short /** */ comments explaining why are the norm.
        Use `import type` for type-only imports.
        No console.log except server startup messages in server/index.ts.
    - path: "server/**/*.ts"
      instructions: |
        Files: kebab-case. Classes: PascalCase. Functions: camelCase. Constants: SCREAMING_SNAKE_CASE.
        Object dictionaries used as namespaces (ansi, icon) use camelCase — not SCREAMING_SNAKE.
        server/core/ contains all business logic, db, and type definitions.
        server/transports/ contains the MCP (stdio) and HTTP/SSE transport layers.
        server/utils/ is used by the server only; the plugin never imports from server/.
    - path: "plugin/**/*.ts"
      instructions: |
        plugin/ ships separately (installed from a marketplace; only plugin/ is copied to the user's
        machine), so it must stay self-contained: no imports from server/. Utilities it shares with the
        server (ANSI codes, icons, message builders) are deliberately duplicated in
        plugin/hooks/scripts/hooks-lib.ts. npm packages the hooks need go in plugin/package.json,
        never the root package.json.
    - path: "plugin/hooks/scripts/**/*.ts"
      instructions: |
        Classic Claude Code command hooks: standalone Bun processes started per event, reading the
        hook input on stdin. They reach the MCP server over HTTP, discovering it via a per-project
        lockfile (resolveServerUrl in hooks-lib.ts).
    - path: "plugin/hooks/mods/**/*.ts"
      instructions: |
        Claude Code hooks modules ("mods"), loaded via `modules` in plugin/hooks/hooks.json. They run
        inside Claude Code's own mod environment, not Bun or Node: no Node/Bun APIs, no DOM; everything
        outside the module goes through the engine interface `$` (e.g. $.fs, $.mcp.call to the plugin's
        MCP server, $.ui, $.clock). Hooks are `($, e, next)`; a failure must degrade to the default
        behaviour (`.catch(($, e, next) => next(e))`), never block the person.
        Pure helpers live in separate files (e.g. checkpoint.ts); code that calls `$` stays in index.ts.
        Tests (*.test.ts here) use `claude-code/testing` and run with `claude plugin test plugin`,
        not bun:test.
    - path: "tests/**/*.ts"
      instructions: |
        Framework: bun:test (not Jest/Vitest).
        Most tests require preload script (tests/preload.ts) for embedding model.
        tests/benchmark/ contains non-deterministic quality metrics — not CI gates.
        Deterministic retrieval tests live in tests/retrieval.test.ts.

  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false
    ignore_title_keywords:
      - "WIP"
    base_branches:
      - "main"

  tools:
    biome:
      enabled: true
    eslint:
      enabled: false
    ruff:
      enabled: false
    pylint:
      enabled: false
    golangci-lint:
      enabled: false
    shellcheck:
      enabled: false
    swiftlint:
      enabled: false
    phpstan:
      enabled: false
    detekt:
      enabled: false

chat:
  auto_reply: true

knowledge_base:
  learnings:
    scope: "auto"
  code_guidelines:
    enabled: true
